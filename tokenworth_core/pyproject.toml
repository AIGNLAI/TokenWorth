[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenworth-core"
version = "0.2.0"
description = "Online TokenWorth core shared by benchmark adapters"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21,<3"]

[tool.setuptools]
packages = ["tokenworth_core"]
package-dir = {tokenworth_core = "."}
