import:
- ../utils/definition.yaml
task_dict:
  db_bench:
    module: src.tasks.instance.db_bench.DBBench
    parameters:
      task_name:
        module: src.typings.TaskName
        parameters:
          value: db_bench
      system_prompt_factory:
        module: src.factories.system_prompt.SystemPromptFactory
        parameters:
          system_prompt_dict_path: ./system_prompts/standard/db_bench.json
      data_file_path: ./data/lifelongagent_bench/db/entry_dict.json
      max_round: 3
      container_image: mysql:8.0
assignment_config:
  task: db_bench
  language_model_list:
  - name: experiment_model
  agent:
    name: language_model_agent
    custom_parameters:
      language_model: experiment_model
      inference_config_dict:
        max_tokens: 128
        temperature: 0
        top_p: 1.0
      action_normalization: first_action_v1
  generation_budget: 128
  resource_budget:
    generation_budget: 128
    interaction_rounds: 3
    memory_capacity: 64
    retrieval_top_k: 1
    candidate_count: 12
    injection_chars: 900
    auxiliary_max_tokens: 128
