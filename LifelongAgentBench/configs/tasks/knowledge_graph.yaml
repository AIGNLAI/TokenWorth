import:
- ../utils/definition.yaml
task_dict:
  knowledge_graph:
    module: src.tasks.instance.knowledge_graph.KnowledgeGraph
    parameters:
      task_name:
        module: src.typings.TaskName
        parameters:
          value: knowledge_graph
      system_prompt_factory:
        module: src.factories.system_prompt.SystemPromptFactory
        parameters:
          system_prompt_dict_path: ./system_prompts/standard/knowledge_graph_agentbench_v02_strict.json
      sparql_url: http://127.0.0.1:3001/sparql
      ontology_dir_path: ./data/lifelongagent_bench/kg/ontology
      data_file_path: ./data/lifelongagent_bench/kg/entry_dict.json
      max_round: 15
      allow_final_answer_after_round_limit: true
assignment_config:
  task: knowledge_graph
  language_model_list:
  - name: experiment_model
  agent:
    name: language_model_agent
    custom_parameters:
      language_model: experiment_model
      inference_config_dict:
        max_tokens: 128
        temperature: 0
        top_p: 1.0
      action_normalization: first_action_v1
  generation_budget: 128
  resource_budget:
    generation_budget: 128
    interaction_rounds: 15
    memory_capacity: 64
    retrieval_top_k: 1
    candidate_count: 12
    injection_chars: 4096
    auxiliary_max_tokens: 128
