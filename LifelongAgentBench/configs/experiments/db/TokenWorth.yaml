import:
- ../../tasks/db.yaml
assignment_config:
  callback_dict:
    callback_0:
      name: TokenWorth
      custom_parameters:
        max_snippet_length: 900
        max_injected_chars_total: 900
        krr_update_interval: 50
        agop_update_interval: 200
        rfm_influence: 0.15
        min_pair_count_for_rfm: 4
        embedding_cache_enabled: true
    callback_1:
      name: saving
    callback_2:
      name: abnormal
    callback_3:
      name: memory_monitor
  output_dir: outputs/runs/TokenWorth-db-{TIMESTAMP_MS}
  sample_order: default
