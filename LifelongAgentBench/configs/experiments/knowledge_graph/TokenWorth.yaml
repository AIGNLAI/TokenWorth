import:
- ../../tasks/knowledge_graph.yaml
assignment_config:
  callback_dict:
    callback_0:
      name: TokenWorth
      custom_parameters:
        max_snippet_length: 4096
        max_injected_chars_total: 4096
        krr_update_interval: 25
        agop_update_interval: 100
        rfm_influence: 0.1
        min_pair_count_for_rfm: 24
        embedding_cache_enabled: false
    callback_1:
      name: saving
    callback_2:
      name: abnormal
    callback_3:
      name: memory_monitor
  output_dir: outputs/runs/TokenWorth-knowledge_graph-{TIMESTAMP_MS}
  sample_order: default
