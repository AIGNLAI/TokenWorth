import:
- ../../tasks/knowledge_graph.yaml
assignment_config:
  callback_dict:
    callback_0:
      name: MemP
      custom_parameters:
        language_model: experiment_model
        top_k: 1
        max_memory_count: 64
        max_trajectory_length: 4096
        max_injected_chars_total: 4096
        use_evaluator_outcome_only: true
        auxiliary_max_tokens: 128
    callback_1:
      name: saving
    callback_2:
      name: abnormal
    callback_3:
      name: memory_monitor
  output_dir: outputs/runs/MemP-knowledge_graph-{TIMESTAMP_MS}
  sample_order: default
