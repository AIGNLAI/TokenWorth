EvoSkill:
  module: "src.callbacks.instance.EvoSkill.EvoSkillCallback"
  parameters:
    language_model: "PLACEHOLDER_LANGUAGE_MODEL"
    top_k: 4
    max_skill_count: 64
    max_context_length: 4000
    max_trajectory_length: 3000
    failure_batch_size: 4
    evolution_interval: 25
    validation_window: 25
    baseline_window: 50
    feedback_history_size: 32
    max_failure_buffer_size: 64
    min_token_overlap: 1
    min_acceptance_rate: 0.0
    min_score_delta: 0.0
    max_injected_chars_total: 4000
    auxiliary_max_tokens: null
